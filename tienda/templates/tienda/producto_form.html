{% extends "tienda/base.html" %}
{% block titulo %}{% if producto %}Editar{% else %}Nuevo{% endif %} producto{% endblock %}

{% block contenido %}
<h2>{% if producto %}Editar producto{% else %}Nuevo producto{% endif %}</h2>
<form method="post">
  {% csrf_token %}
  <div class="mb-3">
    <label for="id_nombre">Nombre</label>
    <input id="id_nombre" type="text" name="nombre" title="Nombre del producto" placeholder="Ingrese nombre" value="{{ producto.nombre|default:'' }}" class="form-control">
  </div>
  <div class="mb-3">
    <label for="id_precio">Precio</label>
    <input id="id_precio" type="number" name="precio" title="Precio del producto" placeholder="0.00" step="0.01" value="{{ producto.precio|default:'' }}" class="form-control">
  </div>
  <div class="mb-3">
    <label for="id_stock">Stock</label>
    <input id="id_stock" type="number" name="stock" title="Cantidad en stock" placeholder="0" value="{{ producto.stock|default:0 }}" class="form-control">
  </div>
  <div class="mb-3">
    <label for="id_categoria">Categoría</label>
    <select id="id_categoria" name="categoria" title="Categoría del producto" class="form-select">
      {% for c in categorias %}
        <option value="{{ c.id }}" {% if producto and c.id == producto.categoria.id %}selected{% endif %}>
          {{ c.nombre }}
        </option>
      {% endfor %}
    </select>
  </div>
  <button type="submit" class="btn btn-primary">Guardar</button>
</form>
{% endblock %}
